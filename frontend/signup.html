<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diabetes Risk Predictor | AI Health Analyzer</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <meta name="description"
        content="AI-powered tool to predict diabetes risk and get personalized lifestyle recommendations.">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 100%;
            max-width: 480px;
            padding: 2rem;
            z-index: 1;
        }

        .login-header {
            text-align: center;
            margin-bottom: 2.5rem;
            animation: fadeInDown 0.8s ease-out;
        }

        .login-header .logo-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 64px;
            border-radius: 20px;
            background: linear-gradient(135deg, var(--accent-primary), #3b82f6);
            margin-bottom: 1.5rem;
            box-shadow: 0 10px 30px rgba(6, 182, 212, 0.3);
        }

        .login-header .logo-icon svg {
            color: white;
            width: 32px;
            height: 32px;
        }

        .login-header h1 {
            font-size: 2rem;
            font-weight: 750;
            letter-spacing: -0.03em;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }

        .login-header p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .login-form .input-grid {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .login-error {
            display: none;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
            padding: 0.85rem 1.25rem;
            border-radius: 12px;
            font-size: 0.9rem;
            text-align: center;
            margin-bottom: 1.5rem;
            animation: fadeIn 0.3s ease-out;
            backdrop-filter: blur(8px);
        }

        .login-success {
            display: none;
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.4);
            color: #86efac;
            padding: 0.85rem 1.25rem;
            border-radius: 12px;
            font-size: 0.9rem;
            text-align: center;
            margin-bottom: 1.5rem;
            animation: fadeIn 0.3s ease-out;
            backdrop-filter: blur(8px);
        }

        body.light-theme .login-error {
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.25);
            color: #dc2626;
        }

        body.light-theme .login-success {
            background: rgba(34, 197, 94, 0.08);
            border: 1px solid rgba(34, 197, 94, 0.25);
            color: #16a34a;
        }

        .login-error.visible, .login-success.visible {
            display: block;
        }

        .auth-footer {
            text-align: center;
            margin-top: 1.5rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .auth-footer a {
            color: var(--accent-primary);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .auth-footer a:hover {
            color: #3b82f6;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="background-fx">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <main class="login-container">
        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
            <svg id="sun-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
            <svg id="moon-icon" class="hidden" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>

        <div class="login-header">
            <div class="logo-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
            </div>
            <h1>Create Account</h1>
            <p>Join the Diabetes Risk AI Predictor community</p>
        </div>

        <section class="glass-panel" id="signup-panel">
            <div id="signup-error" class="login-error">Something went wrong</div>
            <div id="signup-success" class="login-success">Account created! Redirecting to login...</div>

            <form id="signup-form" class="login-form" autocomplete="off">
                <div class="input-grid">
                    <div class="input-group">
                        <input type="text" id="username" name="username" required placeholder=" " autofocus>
                        <label for="username">Username</label>
                    </div>
                    <div class="input-group">
                        <input type="password" id="password" name="password" required placeholder=" ">
                        <label for="password">Password</label>
                    </div>
                    <div class="input-group">
                        <input type="password" id="confirm-password" name="confirm-password" required placeholder=" ">
                        <label for="confirm-password">Confirm Password</label>
                    </div>
                </div>

                <div class="action-bar">
                    <button type="submit" class="primary-btn" id="signup-btn">
                        <span class="btn-text">Sign Up</span>
                        <div class="spinner hidden" id="signup-spinner"></div>
                    </button>
                </div>
            </form>

            <div class="auth-footer">
                Already have an account? <a href="login.html">Sign In</a>
            </div>
        </section>
    </main>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const themeToggleBtn = document.getElementById('theme-toggle');
        const sunIcon = document.getElementById('sun-icon');
        const moonIcon = document.getElementById('moon-icon');

        if (localStorage.getItem('theme') === 'light') {
            document.body.classList.add('light-theme');
            sunIcon.classList.add('hidden');
            moonIcon.classList.remove('hidden');
        }

        themeToggleBtn.addEventListener('click', () => {
            document.body.classList.toggle('light-theme');
            const isLight = document.body.classList.contains('light-theme');
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
            sunIcon.classList.toggle('hidden');
            moonIcon.classList.toggle('hidden');
        });

        const form = document.getElementById('signup-form');
        const signupBtn = document.getElementById('signup-btn');
        const btnText = signupBtn.querySelector('.btn-text');
        const spinner = document.getElementById('signup-spinner');
        const errorBox = document.getElementById('signup-error');
        const successBox = document.getElementById('signup-success');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorBox.classList.remove('visible');
            successBox.classList.remove('visible');

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            if (password !== confirmPassword) {
                errorBox.textContent = "Passwords do not match";
                errorBox.classList.add('visible');
                return;
            }

            btnText.classList.add('hidden');
            spinner.classList.remove('hidden');
            signupBtn.disabled = true;

            try {
                const response = await fetch(`https://diebeties-risk-predictor-deployment.onrender.com/api/signup`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    successBox.classList.add('visible');
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    errorBox.textContent = data.detail || "Signup failed";
                    errorBox.classList.add('visible');
                    btnText.classList.remove('hidden');
                    spinner.classList.add('hidden');
                    signupBtn.disabled = false;
                }
            } catch (error) {
                errorBox.textContent = "Connection error. Is the backend running?";
                errorBox.classList.add('visible');
                btnText.classList.remove('hidden');
                spinner.classList.add('hidden');
                signupBtn.disabled = false;
            }
        });

        // Reset button state if user navigates back to this page
        window.addEventListener('pageshow', (event) => {
            if (event.persisted) {
                btnText.classList.remove('hidden');
                spinner.classList.add('hidden');
                signupBtn.disabled = false;
            }
        });
    });
    </script>
</body>
</html>
